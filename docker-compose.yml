services:
  mongodb:
    image: public.ecr.aws/docker/library/mongo:7
    container_name: ai-crafter-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  mongo-express:
    image: public.ecr.aws/docker/library/mongo-express:1.0.2
    container_name: ai-crafter-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
    depends_on:
      - mongodb
volumes:
  mongo_data:
